<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unire Screen Capture</title>
</head>
<body>
  <video id="video" muted playsinline></video>
  <canvas id="canvas"></canvas>
  <script>
    // Hidden helper window: keeps a live desktop stream open so frames can be grabbed instantly.
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    let latestFrame = null;

    async function readFrames(track) {
      const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (latestFrame) latestFrame.close();
        latestFrame = value;
      }
    }

    window.startCapture = async (sourceId, maxSize) => {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          mandatory: {
            chromeMediaSource: 'desktop',
            chromeMediaSourceId: sourceId,
            maxWidth: maxSize,
            maxHeight: maxSize,
            maxFrameRate: 30
          }
        }
      });
      const [track] = stream.getVideoTracks();
      if (window.MediaStreamTrackProcessor) {
        readFrames(track).catch(() => {});
      } else {
        video.srcObject = stream;
        await video.play();
      }
      return true;
    };

    window.grabFrame = (quality) => {
      const source = latestFrame || (video.videoWidth ? video : null);
      if (!source) return null;
      canvas.width = latestFrame ? latestFrame.displayWidth : video.videoWidth;
      canvas.height = latestFrame ? latestFrame.displayHeight : video.videoHeight;
      context.drawImage(source, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', quality);
    };
  </script>
</body>
</html>

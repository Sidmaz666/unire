<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Unire Screen Host</title>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Hidden Electron window: captures the desktop once and serves each phone as WebRTC
    // peers ("screen" video, "audio" system sound, input data channels). Also provides
    // JPEG frames for the socket fallback stream.
    const params = new URLSearchParams(location.search);
    const sourceId = params.get('source');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const peers = new Map();
    const IDLE_STOP_MS = 30 * 1000;
    let mediaPromise = null;
    let latestFrame = null;
    let frameReaderStarted = false;
    let idleTimer = null;

    function desktopConstraints() {
      return {
        mandatory: {
          chromeMediaSource: 'desktop',
          chromeMediaSourceId: sourceId,
          maxWidth: 1920,
          maxHeight: 1920,
          maxFrameRate: 60
        }
      };
    }

    function acquireMedia() {
      return navigator.mediaDevices.getUserMedia({ audio: false, video: desktopConstraints() });
    }

    function getMedia() {
      clearTimeout(idleTimer);
      if (!mediaPromise) {
        mediaPromise = acquireMedia();
        mediaPromise.catch(() => { mediaPromise = null; });
      }
      return mediaPromise;
    }

    function scheduleIdleStop() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(async () => {
        if (countPeers('screen') || !mediaPromise) return;
        const media = await mediaPromise.catch(() => null);
        mediaPromise = null;
        frameReaderStarted = false;
        if (latestFrame) { latestFrame.close(); latestFrame = null; }
        if (media) media.getTracks().forEach(track => track.stop());
      }, IDLE_STOP_MS);
    }

    // ---- JPEG frames for the fallback stream ----
    async function readFrames(track) {
      const reader = new MediaStreamTrackProcessor({ track }).readable.getReader();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (latestFrame) latestFrame.close();
        latestFrame = value;
      }
    }

    window.grabFrame = async (quality) => {
      const media = await getMedia();
      if (!frameReaderStarted) {
        frameReaderStarted = true;
        readFrames(media.getVideoTracks()[0].clone()).catch(() => { frameReaderStarted = false; });
      }
      for (let attempt = 0; attempt < 40 && !latestFrame; attempt++) {
        await new Promise(resolve => setTimeout(resolve, 25));
      }
      scheduleIdleStop();
      if (!latestFrame) return null;
      canvas.width = latestFrame.displayWidth;
      canvas.height = latestFrame.displayHeight;
      context.drawImage(latestFrame, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', quality);
    };

    // ---- WebRTC peers ----
    const socket = io({ auth: { captureToken: params.get('token') }, transports: ['websocket'] });

    const peerKey = (kind, viewerId) => `${kind}:${viewerId}`;

    function countPeers(kind) {
      let count = 0;
      for (const peer of peers.values()) if (peer.kind === kind) count++;
      return count;
    }

    function closePeer(viewerId, kind = 'screen') {
      const key = peerKey(kind, viewerId);
      const peer = peers.get(key);
      if (!peer) return;
      peers.delete(key);
      peer.tracks.forEach(track => track.stop());
      peer.pc.close();
      if (kind === 'screen' && !countPeers('screen')) scheduleIdleStop();
      if (kind === 'audio' && !countPeers('audio')) stopAudioCapture();
    }

    // ---- System audio ----
    // Captured with Electron's loopback; "loopbackWithMute" keeps capturing while silencing
    // the computer's own speakers (Windows). Capture stops (and the host unmutes) as soon
    // as no phone is listening.
    let hostMuted = false;
    let audioCapture = null; // { promise, muted }

    async function acquireAudio(muted) {
      const mode = await window.unireHost.setLoopbackMode(muted);
      // Raw system sound: voice processing (echo cancel, noise suppression, gain) only adds
      // delay and damages music.
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: true,
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
      stream.getVideoTracks().forEach(track => track.stop());
      if (!stream.getAudioTracks().length) throw new Error('System audio capture is not supported on this computer');
      stream.getAudioTracks().forEach(track => { track.contentHint = 'music'; });
      if (muted) socket.emit('host-audio:support', { muteSupported: mode === 'loopbackWithMute' });
      return stream;
    }

    function getAudioStream() {
      if (!audioCapture || audioCapture.muted !== hostMuted) {
        const previous = audioCapture;
        audioCapture = { muted: hostMuted, promise: acquireAudio(hostMuted) };
        const current = audioCapture;
        current.promise.catch(() => { if (audioCapture === current) audioCapture = null; });
        if (previous) previous.promise.then(stream => stream.getTracks().forEach(t => t.stop())).catch(() => {});
      }
      return audioCapture.promise;
    }

    function stopAudioCapture() {
      if (!audioCapture) return;
      audioCapture.promise.then(stream => stream.getTracks().forEach(t => t.stop())).catch(() => {});
      audioCapture = null;
    }

    async function applyHostMute(muted) {
      hostMuted = Boolean(muted);
      if (!countPeers('audio')) return;
      try {
        const stream = await getAudioStream();
        for (const peer of peers.values()) {
          if (peer.kind !== 'audio') continue;
          const track = stream.getAudioTracks()[0].clone();
          await peer.sender.replaceTrack(track);
          peer.tracks.forEach(old => old.stop());
          peer.tracks = [track];
        }
      } catch (err) {
        socket.emit('host-audio:support', { muteSupported: false });
      }
    }

    function tuneOpus(description) {
      // Stereo, high-bitrate Opus in 10 ms packets (half the default) for low latency,
      // with DTX off so quiet passages never pause the stream.
      const sdp = description.sdp
        .replace(/a=ptime:\d+\r\n/g, '')
        .replace(/a=fmtp:(\d+) ([^\r\n]*useinbandfec=1[^\r\n]*)/g, (line, pt, params) =>
          `a=fmtp:${pt} ${params};stereo=1;sprop-stereo=1;maxaveragebitrate=256000;usedtx=0\r\na=ptime:10`);
      return { type: description.type, sdp };
    }

    async function startAudioPeer(viewerId) {
      const key = peerKey('audio', viewerId);
      closePeer(viewerId, 'audio');
      try {
        const stream = await getAudioStream();
        const track = stream.getAudioTracks()[0].clone();
        const pc = new RTCPeerConnection({ iceServers: [] });
        const transceiver = pc.addTransceiver(track, { direction: 'sendonly', streams: [new MediaStream([track])] });
        const peer = { pc, kind: 'audio', tracks: [track], sender: transceiver.sender, pendingCandidates: [] };
        peers.set(key, peer);
        pc.onicecandidate = (event) => {
          if (event.candidate) socket.emit('rtc:signal', { to: viewerId, data: { kind: 'audio', candidate: event.candidate } });
        };
        pc.onconnectionstatechange = () => {
          if (['failed', 'closed'].includes(pc.connectionState)) closePeer(viewerId, 'audio');
        };
        await pc.setLocalDescription(await pc.createOffer());
        socket.emit('rtc:signal', { to: viewerId, data: { kind: 'audio', sdp: pc.localDescription } });
      } catch (err) {
        closePeer(viewerId, 'audio');
        socket.emit('rtc:error', { to: viewerId, kind: 'audio', message: err.message || 'Audio capture failed' });
      }
    }

    function preferCodecs(transceiver) {
      const capabilities = RTCRtpSender.getCapabilities && RTCRtpSender.getCapabilities('video');
      if (!capabilities || !transceiver.setCodecPreferences) return;
      // Hardware H.264 keeps PC CPU low and decodes well on phones.
      const rank = (codec) => codec.mimeType === 'video/H264' ? 0 : codec.mimeType === 'video/VP8' ? 1 : 2;
      const codecs = [...capabilities.codecs].sort((a, b) => rank(a) - rank(b));
      try { transceiver.setCodecPreferences(codecs); } catch {}
    }

    async function startPeer({ viewerId, smooth, kind }) {
      if (kind === 'audio') return startAudioPeer(viewerId);
      closePeer(viewerId);
      try {
        const media = await getMedia();
        const video = media.getVideoTracks()[0].clone();
        video.contentHint = smooth ? 'motion' : 'detail';
        const tracks = [video];

        const pc = new RTCPeerConnection({ iceServers: [] });
        const peer = { pc, kind: 'screen', tracks, pendingCandidates: [] };
        peers.set(peerKey('screen', viewerId), peer);
        const outgoing = new MediaStream(tracks);
        const videoTransceiver = pc.addTransceiver(video, { direction: 'sendonly', streams: [outgoing] });
        preferCodecs(videoTransceiver);

        pc.onicecandidate = (event) => {
          if (event.candidate) socket.emit('rtc:signal', { to: viewerId, data: { candidate: event.candidate } });
        };
        pc.onconnectionstatechange = () => {
          if (['failed', 'closed'].includes(pc.connectionState)) closePeer(viewerId);
        };

        await pc.setLocalDescription(await pc.createOffer());
        socket.emit('rtc:signal', {
          to: viewerId,
          data: { sdp: pc.localDescription }
        });

        const sender = videoTransceiver.sender;
        const parameters = sender.getParameters();
        parameters.encodings = parameters.encodings?.length ? parameters.encodings : [{}];
        parameters.encodings[0].maxBitrate = smooth ? 12000000 : 8000000;
        parameters.encodings[0].maxFramerate = smooth ? 60 : 30;
        parameters.degradationPreference = smooth ? 'maintain-framerate' : 'balanced';
        sender.setParameters(parameters).catch(() => {});
      } catch (err) {
        closePeer(viewerId);
        socket.emit('rtc:error', { to: viewerId, message: `Screen capture failed: ${err.message}` });
      }
    }

    // ---- Input data channels: phone -> this window -> Electron main (nut-js) ----
    const inputPeers = new Map();

    function closeInputPeer(viewerId) {
      const peer = inputPeers.get(viewerId);
      if (!peer) return;
      inputPeers.delete(viewerId);
      peer.pc.close();
    }

    async function handleInputSignal({ from, data }) {
      if (!data || !window.unireHost) return;
      try {
        if (data.sdp) {
          closeInputPeer(from);
          const pc = new RTCPeerConnection({ iceServers: [] });
          const peer = { pc, pendingCandidates: [] };
          inputPeers.set(from, peer);
          pc.ondatachannel = ({ channel }) => {
            channel.onmessage = (event) => window.unireHost.input(from, event.data);
          };
          pc.onicecandidate = (event) => {
            if (event.candidate) socket.emit('input:signal', { to: from, data: { candidate: event.candidate } });
          };
          pc.onconnectionstatechange = () => {
            if (['failed', 'closed'].includes(pc.connectionState)) closeInputPeer(from);
          };
          await pc.setRemoteDescription(data.sdp);
          await pc.setLocalDescription(await pc.createAnswer());
          socket.emit('input:signal', { to: from, data: { sdp: pc.localDescription } });
          for (const candidate of peer.pendingCandidates) await pc.addIceCandidate(candidate).catch(() => {});
          peer.pendingCandidates = [];
        } else if (data.candidate) {
          const peer = inputPeers.get(from);
          if (!peer) return;
          if (peer.pc.remoteDescription) await peer.pc.addIceCandidate(data.candidate).catch(() => {});
          else peer.pendingCandidates.push(data.candidate);
        }
      } catch {
        closeInputPeer(from);
      }
    }

    socket.on('input:signal', handleInputSignal);
    socket.on('input:stop', ({ viewerId }) => closeInputPeer(viewerId));

    socket.on('rtc:start', startPeer);
    socket.on('rtc:stop', ({ viewerId, kind }) => closePeer(viewerId, kind || 'screen'));
    socket.on('host-audio:mode', ({ muted }) => applyHostMute(muted));
    socket.on('rtc:signal', async ({ from, data }) => {
      const kind = data?.kind || 'screen';
      const peer = peers.get(peerKey(kind, from));
      if (!peer || !data) return;
      try {
        if (data.sdp) {
          // The sender follows the receiver's Opus parameters, so tune the phone's answer.
          await peer.pc.setRemoteDescription(kind === 'audio' ? tuneOpus(data.sdp) : data.sdp);
          for (const candidate of peer.pendingCandidates) await peer.pc.addIceCandidate(candidate).catch(() => {});
          peer.pendingCandidates = [];
        } else if (data.candidate) {
          if (peer.pc.remoteDescription) await peer.pc.addIceCandidate(data.candidate).catch(() => {});
          else peer.pendingCandidates.push(data.candidate);
        }
      } catch (err) {
        closePeer(from, kind);
        socket.emit('rtc:error', { to: from, kind, message: 'Could not connect the stream' });
      }
    });
  </script>
</body>
</html>
